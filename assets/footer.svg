<rect x="0.5" y="0.5" width="999" height="95" rx="20" fill="#101d25" stroke="#30464f" /><text x="32" y="57" fill="#bdf4cf" font-size="28" font-weight="600" >Build thoughtfully. Make it useful.</text><text x="966" y="55" fill="#afc0c3" font-size="13" font-weight="600" font-family="Consolas, monospace" letter-spacing="2" text-anchor="end">MAAZ SOHAIL</text></g></svg>
